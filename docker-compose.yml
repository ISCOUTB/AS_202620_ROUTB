services:
  db:
    image: postgres:16-alpine
    container_name: routb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: routb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routb_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/routb
      - JWT_SECRET_KEY=local-docker-compose-secret-key-32-chars-long
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
