name: CI ROUTB

permissions:
  contents: read

on:
  push:
    branches: [master, Changes]
  pull_request:
    branches: [master, Changes]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: routb
          POSTGRES_PASSWORD: routb_test
          POSTGRES_DB: routb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routb -d routb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Verificar ciclo de migraciones Alembic
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
        env:
          DATABASE_URL_TEST: postgresql+psycopg2://routb:routb_test@localhost:5432/routb_test
          TESTING: "1"

      - name: Ejecutar pruebas unitarias y de contrato OpenAPI
        working-directory: backend
        run: |
          set -o pipefail
          pytest -v -s 2>&1 | tee backend-test-output.log
          grep -E 'OSRM .* N=50 p95=' backend-test-output.log >> "$GITHUB_STEP_SUMMARY" || true
        env:
          DATABASE_URL_TEST: postgresql+psycopg2://routb:routb_test@localhost:5432/routb_test
          TESTING: "1"
          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "60"

      - name: Verificar contrato OpenAPI
        working-directory: backend
        run: pytest tests/test_openapi_contract.py -v
        env:
          DATABASE_URL_TEST: postgresql+psycopg2://routb:routb_test@localhost:5432/routb_test
          TESTING: "1"
          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "60"

  flutter-ci:
    name: Flutter Analyze, Test & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get --enforce-lockfile

      - name: Verify code formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static code analysis
        working-directory: frontend
        run: flutter analyze

      - name: Run widget and unit tests
        working-directory: frontend
        run: flutter test

  dependency-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python environment
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: "pip install --only-binary=:all: pip-audit==2.9.0"
      - name: Run pip-audit vulnerability scan
        working-directory: backend
        run: pip-audit -r requirements.txt

  sonar:
    name: SonarCloud Scan & Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "SonarCloud reservado sin SONAR_TOKEN"

  build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: routb-backend:latest
