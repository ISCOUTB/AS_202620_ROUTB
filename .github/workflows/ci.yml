name: CI ROUTB

on:
  push:
    branches: [master, Changes]
  pull_request:
    branches: [master, Changes]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python environment
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Probar ciclo de migraciones Alembic contra Supabase
        working-directory: backend
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::El secreto DATABASE_URL no está configurado en GitHub."
            exit 1
          fi
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ejecutar pruebas unitarias y de contrato OpenAPI
        working-directory: backend
        run: |
          if [ -z "$DATABASE_URL_TEST" ]; then
            echo "::error::El secreto DATABASE_URL_TEST no está configurado en GitHub."
            exit 1
          fi
          pytest -v
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "60"

  build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: routb-backend:latest
