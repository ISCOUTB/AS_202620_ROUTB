name: CI ROUTB

on:
  push:
    branches: [master, Changes]
  pull_request:
    branches: [master, Changes]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: routb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Ejecutar pruebas unitarias y de contrato OpenAPI
        working-directory: backend
        run: pytest -v
        env:
          DATABASE_URL_TEST: postgresql://test:test@localhost:5432/routb_test
          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "60"

  build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: routb-backend:latest