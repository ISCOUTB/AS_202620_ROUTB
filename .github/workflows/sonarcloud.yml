name: SonarCloud ROUTB

on:
  push:
    branches: [master, Changes]
  pull_request:
    branches: [master, Changes]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is missing or unavailable for this workflow."
            exit 1
          fi

          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --user "$SONAR_TOKEN:" \
            https://sonarcloud.io/api/authentication/validate)"

          if [ "$status" != "200" ]; then
            echo "SONAR_TOKEN was rejected by SonarCloud (HTTP $status)."
            exit 1
          fi

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=isco-utb
            -Dsonar.projectKey=ISCOUTB_AS_202620_ROUTB
            -Dsonar.host.url=https://sonarcloud.io
