name: SonarCloud ROUTB

on:
  push:
    branches: [master, Changes]
  pull_request:
    branches: [master, Changes]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=isco-utb
            -Dsonar.projectKey=ISCOUTB_AS_202620_ROUTB
            -Dsonar.host.url=https://sonarcloud.io
