# Dokploy termina TLS antes de este contenedor, así que la petición llega por
# HTTP. Se conserva el esquema original si el proxy lo envía; si no, se asume
# HTTPS porque la web se publica por ese protocolo.
map $http_x_forwarded_proto $routb_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    # El backend entrega hoy una cadena TLS incompleta; por eso no se activa
    # proxy_ssl_verify. Si Dokploy sirve la cadena completa, se puede habilitar
    # con proxy_ssl_verify on y un bundle de confianza.
    # Solicitudes hacia FastAPI: /api/trips/ -> /trips/
    location /api/ {
        proxy_pass https://routb.iscoutb.dev/;
        proxy_ssl_server_name on;
        proxy_set_header Host routb.iscoutb.dev;
        proxy_set_header X-Forwarded-Proto $routb_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # FastAPI responde con redirecciones absolutas al host del backend.
        # Se reescriben al dominio público del frontend para no exponer la API
        # y para conservar HTTPS.
        proxy_redirect http://routb.iscoutb.dev/ https://routb.iscoutb.dev;
        proxy_redirect https://routb.iscoutb.dev/ https://routb.iscoutb.dev;
    }

    # Documentación interactiva de FastAPI.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass https://routb.iscoutb.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host routb.iscoutb.dev;
        proxy_set_header X-Forwarded-Proto $routb_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flutter Web y sus rutas internas.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
