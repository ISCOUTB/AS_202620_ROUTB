name: frontend
description: "ROUTB, plataforma de transporte compartido para estudiantes de la UTB."
publish_to: 'none'

# version: número de versión de la app
#         número de build que se incrementa por cada publicación
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Cliente HTTP para la API de ROUTB (FastAPI).
  http: ^1.2.0
  # Sesión persistente: token de acceso, nombre, rol y tema.
  shared_preferences: ^2.5.5
  # Mapa del conductor y del detalle de ruta (tiles de OpenStreetMap).
  flutter_map: ^8.3.2
  # Coordenadas geográficas para flutter_map.
  latlong2: ^0.10.1

  cupertino_icons: ^1.0.8
  geolocator: ^14.1.1
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # Titulares, nombres de sección y cifras grandes.
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    # Todo el texto de interfaz.
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
